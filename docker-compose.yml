services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: palladium
      POSTGRES_PASSWORD: palladium
      POSTGRES_DB: palladium
    ports:
      - "5432:5432"
    volumes:
      - palladium-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palladium"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  palladium-postgres-data:
