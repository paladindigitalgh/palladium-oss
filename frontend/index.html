<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- These follow the OS/browser's prefers-color-scheme, which is
         independent of the app's own in-app theme toggle (useTheme.ts) --
         there is no way for a <link> favicon to react to page-level
         theme state, only to the system setting. -->
    <link rel="icon" href="/palladium-favicon.ico" sizes="any" media="(prefers-color-scheme: light)" />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/palladium-favicon-512.png"
      media="(prefers-color-scheme: light)"
    />
    <link rel="icon" href="/palladium-favicon-dark.ico" sizes="any" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/palladium-favicon-512-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/palladium-favicon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palladium OSS</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
